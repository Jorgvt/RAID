[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raid"
version = "0.1.0"
description = "Response to Affine Transforms of Image Distance Metrics and Humans"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.0.0",
    "nvidia-cublas-cu12>=12.4.5.8",
    "nvidia-cuda-nvrtc-cu12>=12.4.127",
    "nvidia-cuda-runtime-cu12>=12.4.127",
    "nvidia-cudnn-cu12>=9.1.0.70",
    "nvidia-nccl-cu12>=2.21.5",
    "pandas>=2.2.0",
    "pillow>=10.0.0",
    "piq>=0.8.0",
    "scikit-image>=0.24.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "seaborn>=0.13.2",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "tqdm>=4.66.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
